<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="leatherGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6B3410" />
      <stop offset="50%" stop-color="#4A2208" />
      <stop offset="100%" stop-color="#2E1404" />
    </linearGradient>
  </defs>
  <!-- Vintage Mahogany Leather Badge Base -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#leatherGrad)" stroke="#0F172A" stroke-width="3.5" />
  <!-- Saddle Stitch Inner Border -->
  <rect x="8" y="8" width="48" height="48" rx="10" stroke="#D6B89C" stroke-width="1.6" stroke-dasharray="4 3" />
  <!-- Subtle Magnifying Ring Accent Around O -->
  <text
    x="32"
    y="43"
    text-anchor="middle"
    fill="#F8FAFC"
    font-family="'Google Sans', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-size="30"
    font-weight="800"
    letter-spacing="-1"
  >
    T<tspan fill="#60A5FA">O</tspan>
  </text>
</svg>
